name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - run: python -m pytest tests/ -v

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Check AWS credentials
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "Credenciais AWS não configuradas, etapa de deploy ignorada."
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.SKIP_DEPLOY != 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        if: env.SKIP_DEPLOY != 'true'
        id: ecr-login

      - name: Build and push image
        if: env.SKIP_DEPLOY != 'true'
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/oficina-auth-lambda
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Update Lambda function
        if: env.SKIP_DEPLOY != 'true'
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/oficina-auth-lambda
        run: |
          aws lambda update-function-code --function-name oficina-auth --image-uri $IMAGE:${{ github.sha }}
