name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes
        run: python -m pytest tests/ -v

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      url: ${{ steps.saidas.outputs.auth_url }}
    env:
      TF_VAR_env: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}
      TF_VAR_datadog_site: ${{ vars.DD_SITE || 'datadoghq.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verifica credenciais AWS
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "Credenciais AWS não configuradas, deploy ignorado."
            echo "SKIP_AWS=true" >> $GITHUB_ENV
          elif [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "::error::Configure a variável TF_STATE_BUCKET com o bucket S3 do estado do Terraform."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.SKIP_AWS != 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        if: env.SKIP_AWS != 'true'
        with:
          terraform_wrapper: false

      - name: Terraform init
        if: env.SKIP_AWS != 'true'
        run: >-
          terraform -chdir=terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=auth-lambda/${ENV}.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="use_lockfile=true"

      - name: Garante o repositório ECR
        if: env.SKIP_AWS != 'true'
        run: terraform -chdir=terraform apply -auto-approve -target=aws_ecr_repository.auth -target=aws_ecr_lifecycle_policy.auth

      - uses: aws-actions/amazon-ecr-login@v2
        if: env.SKIP_AWS != 'true'
        id: ecr

      - name: Build e push da imagem
        if: env.SKIP_AWS != 'true'
        env:
          IMAGEM: ${{ steps.ecr.outputs.registry }}/oficina-auth-${{ env.ENV }}
        run: |
          ALVO=base
          if [ -n "${{ secrets.DD_API_KEY }}" ]; then ALVO=datadog; fi
          docker build --target $ALVO -t $IMAGEM:${{ github.sha }} .
          docker push $IMAGEM:${{ github.sha }}

      - name: Terraform apply
        if: env.SKIP_AWS != 'true'
        run: |
          export TF_VAR_api_url=$(aws ssm get-parameter --name "/oficina/$ENV/api_url" --query Parameter.Value --output text 2>/dev/null || echo "")
          terraform -chdir=terraform apply -auto-approve

      - name: Saídas
        id: saidas
        if: env.SKIP_AWS != 'true'
        run: echo "auth_url=$(terraform -chdir=terraform output -raw auth_url)" >> $GITHUB_OUTPUT
